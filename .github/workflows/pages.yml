name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v6
      - name: Verify the site contains no audio or video
        run: |
          git ls-files dist | while IFS= read -r file; do
            case "${file,,}" in
              *.mp3|*.m4a|*.aac|*.flac|*.wav|*.ogg|*.opus|*.mp4|*.webm|*.mov)
                echo 'Audio and video must stay local.'
                exit 1
                ;;
            esac
          done
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: dist
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
